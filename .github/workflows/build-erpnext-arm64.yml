
name: Build ERPNext v16 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps.json
      - .github/workflows/build-erpnext-arm64.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build custom ERPNext image
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Checkout Frappe Docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Verify ARM64 runner
        run: |
          uname -m
          test "$(uname -m)" = "aarch64"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ERPNext image
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          platforms: linux/arm64
          push: true

          tags: |
            ghcr.io/phosflare/phosflare-erp:v16

          labels: |
            org.opencontainers.image.source=https://github.com/phosflare/phosflare-erp-build
            org.opencontainers.image.description=ERPNext v16 with HRMS and Indian compliance

          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}

          secret-files: |
            apps_json=./apps.json

          cache-from: type=gha
          cache-to: type=gha,mode=max
